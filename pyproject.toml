[project]
name = "lanchan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omzirpe2006", email = "omzirpe2003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.25.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
lanchan = "lanchan:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
